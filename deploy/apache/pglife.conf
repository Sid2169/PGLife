<VirtualHost *:80>
    ServerName pglife.example.com
    ServerAlias www.pglife.example.com

    # Points at the release flips managed by deploy/deploy-vps.sh
    DocumentRoot /var/www/pglife/current

    <Directory /var/www/pglife/current>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # DB credentials are provided to PHP here (or via the FPM pool env).
    SetEnv DB_HOST 127.0.0.1
    SetEnv DB_NAME pglife
    SetEnv DB_USER pglife
    SetEnv DB_PASS REPLACE_WITH_STRONG_PASSWORD
    SetEnv APP_ENV production

    ErrorLog  ${APACHE_LOG_DIR}/pglife_error.log
    CustomLog ${APACHE_LOG_DIR}/pglife_access.log combined
</VirtualHost>
