# nginx equivalent of the Apache config. The bundled .htaccess rules are
# Apache-only, so the deny rules are repeated here.
server {
    listen 80;
    server_name pglife.example.com;

    root /var/www/pglife/current;
    index index.php index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Never expose server-side includes, dotfiles or deploy artifacts.
    location ~ ^/includes/ { deny all; }
    location ~ /\.(?!well-known) { deny all; }
    location ~* \.(sql|md|log|sh|conf|example|yml|yaml)$ { deny all; }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        # Credentials can also be set here via fastcgi_param if preferred.
    }
}
